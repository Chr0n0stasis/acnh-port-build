name: ACNH geometry draw-order probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch private probe inputs
        run: |
          test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" = PRIVATE
          gh release download inputs-v2228224 --repo "$GITHUB_REPOSITORY" --pattern geometry-draw-order.zip
          shasum -a 256 -c geometry-draw-order-sha256.txt
          unzip -q geometry-draw-order.zip -d geometry-draw-order
      - name: Compile compute and vertex programs
        run: |
          if ! xcrun -sdk iphoneos metal --version; then xcodebuild -downloadComponent MetalToolchain; fi
          python3 ci/compile_geometry_draw_order.py
      - name: Upload probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acnh-geometry-draw-order-${{ github.run_number }}
          path: geometry-draw-order-output/
          retention-days: 7
