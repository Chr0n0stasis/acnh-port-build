name: ACNH Apple build
on:
  workflow_dispatch:
    inputs:
      input_tag:
        description: Private release containing build-inputs.zip
        type: string
        required: true
        default: inputs-v2228224
      full_checks:
        description: Build the macOS host and run the full regression suite
        type: boolean
        required: false
        default: false
      geometry_runtime:
        description: Include the geometry renderer (disable only for legacy diagnostics)
        type: boolean
        required: false
        default: true
      verify_rewrite:
        description: Verify ARM64 rewrite structure against ExeFS (slow)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.geometry_runtime && 'acnh-geometry' || 'acnh-apple' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      DM_GAME: acnh
      GAME: acnh
      PYTHONUNBUFFERED: '1'
      J: '3'
      DM_FULL_CHECKS: ${{ inputs.full_checks && '1' || '0' }}
      DM_GEOMETRY_RUNTIME: ${{ inputs.geometry_runtime && '1' || '0' }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Fetch private build inputs
        env:
          INPUT_TAG: ${{ inputs.input_tag }}
        run: |
          gh repo view "$GITHUB_REPOSITORY" --json nameWithOwner,visibility
          gh release download "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --pattern build-inputs.zip
          shasum -a 256 -c input-sha256.txt
          unzip -q build-inputs.zip -d work
          gh release download "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --pattern captured-shaders-20261016-postmovie.zip
          shasum -a 256 -c captured-shaders-sha256.txt
          unzip -q captured-shaders-20261016-postmovie.zip -d work/captured-shaders
      - name: Restore SPIRV-Cross compiler
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: work/toolbin
          key: acnh-spirv-cross-v2-${{ runner.os }}-${{ runner.arch }}-1.4.357.0
      - name: Migrate matching legacy shader cache on first use
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        id: legacy-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            work/toolbin
            output/msl-mac
            output/msl-ios
          key: acnh-apple-${{ runner.os }}-${{ runner.arch }}-${{ inputs.geometry_runtime && format('geometry-{0}-', '271b0a486c35d453753c1423c6ac9121a9980492e3ecd967b1ad8df706a9d6a4') || '' }}migration
          restore-keys: |
            acnh-apple-${{ runner.os }}-${{ runner.arch }}-${{ inputs.geometry_runtime && format('geometry-{0}-', '271b0a486c35d453753c1423c6ac9121a9980492e3ecd967b1ad8df706a9d6a4') || '' }}
      - name: Prepare Apple translation chain
        id: prepare
        run: bash ci/build.sh prepare
      - name: Save SPIRV-Cross compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/toolbin
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Restore matching compiled shaders
        id: shader-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            output/msl-mac/b-${{ steps.prepare.outputs.chain }}
            output/msl-ios/b-${{ steps.prepare.outputs.chain }}
          key: acnh-shaders-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('input-sha256.txt') }}-${{ steps.prepare.outputs.chain }}-${{ hashFiles('source/dm/games/acnh/bf_want.tsv') }}-${{ inputs.full_checks && 'macos-ios' || 'ios' }}
      - name: Restore incremental shader compiler cache for changed chains
        if: steps.shader-cache.outputs.cache-hit != 'true' && steps.legacy-cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            work/toolbin
            output/msl-mac
            output/msl-ios
          key: acnh-apple-${{ runner.os }}-${{ runner.arch }}-${{ inputs.geometry_runtime && format('geometry-{0}-', '271b0a486c35d453753c1423c6ac9121a9980492e3ecd967b1ad8df706a9d6a4') || '' }}incremental
          restore-keys: |
            acnh-apple-${{ runner.os }}-${{ runner.arch }}-${{ inputs.geometry_runtime && format('geometry-{0}-', '271b0a486c35d453753c1423c6ac9121a9980492e3ecd967b1ad8df706a9d6a4') || '' }}
      - name: Verify ARM64 rewrite structure
        if: ${{ inputs.verify_rewrite }}
        run: bash ci/build.sh verify
      - name: Build macOS host and run full checks (optional)
        if: inputs.full_checks
        run: bash ci/build.sh host
      - name: Upload early host diagnostics
        if: failure() || inputs.full_checks
        uses: actions/upload-artifact@v4
        with:
          name: acnh-host-${{ github.run_number }}
          retention-days: 7
          path: |
            output/*.log
            output/dmhost
          if-no-files-found: warn
      - name: Reuse or compile Metal shaders
        id: shaders
        env:
          DM_LEGACY_CACHE: ${{ steps.legacy-cache.outputs.cache-matched-key != '' && '1' || '0' }}
          DM_LEGACY_SHADER_RUN: ${{ inputs.geometry_runtime && '38729191755' || '38755088464' }}
        run: bash ci/build.sh shaders
        timeout-minutes: 30
      - name: Build unsigned iOS bring-up app
        run: bash ci/build.sh ipa
      - name: Upload unsigned bring-up IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acnh-ipa-${{ github.run_number }}
          retention-days: 7
          path: |
            output/*.ipa
            output/IPA-STATUS.txt
            output/BRINGUP-LIMITATIONS.json
          if-no-files-found: warn
      - name: Save compiled shaders for this chain
        if: always() && steps.shaders.outcome == 'success' && steps.shader-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            output/msl-mac/b-${{ steps.prepare.outputs.chain }}
            output/msl-ios/b-${{ steps.prepare.outputs.chain }}
          key: ${{ steps.shader-cache.outputs.cache-primary-key }}
      - name: Upload private build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acnh-diagnostics-${{ github.run_number }}
          retention-days: 7
          path: |
            output/*.log
            output/chain.txt
            output/shader-reuse.json
            output/captured-shaders.json
            source/dm/games/acnh/
            source/dm/gfx/tools/dmsh_chain.lock
          if-no-files-found: warn
